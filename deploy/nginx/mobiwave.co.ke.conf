# MobiWave — production vhost (nginx)
#
# The site is a static build: deploy `dist/` and point `root` at it. This vhost
# replaces `dist/.htaccess`, which nginx does not read.
#
# Do NOT proxy this vhost to `vite preview`. That server is for local checks
# only and answers 403 for the public hostname unless `preview.allowedHosts`
# lists it (see vite.config.ts).
#
# Install:
#   sudo cp deploy/nginx/mobiwave.co.ke.conf /etc/nginx/sites-available/mobiwave.co.ke
#   sudo ln -sf /etc/nginx/sites-available/mobiwave.co.ke /etc/nginx/sites-enabled/mobiwave.co.ke
#   sudo nginx -t && sudo systemctl reload nginx
#
# Verified against nginx 1.18 (the version on 95.217.230.115), hence the legacy
# `listen ... ssl http2` form. On nginx >= 1.25.1 prefer `listen 443 ssl;` plus
# a separate `http2 on;`.

# Cache policy resolved centrally: `add_header` inside a `location` suppresses
# inherited `add_header` from the server block, which would silently drop the
# security headers below for assets. Mapping keeps a single source of truth.
map $uri $mw_cache_control {
    default                                            "public, max-age=0, must-revalidate";
    ~^/assets/                                         "public, max-age=31536000, immutable";
    ~\.(?:webp|avif|jpe?g|png|gif|svg|ico|woff2?)$     "public, max-age=31536000, immutable";
    ~\.(?:css|js)$                                     "public, max-age=2592000";
}

server {
    listen 80;
    listen [::]:80;
    server_name mobiwave.co.ke www.mobiwave.co.ke;

    # Keep ACME challenges reachable over plain HTTP for certbot renewals.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://mobiwave.co.ke$request_uri;
    }
}

# Canonical host: www -> apex.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.mobiwave.co.ke;

    ssl_certificate     /etc/letsencrypt/live/mobiwave.co.ke/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mobiwave.co.ke/privkey.pem;

    return 301 https://mobiwave.co.ke$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mobiwave.co.ke;

    root /var/www/mobiwave/dist;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/mobiwave.co.ke/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mobiwave.co.ke/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    server_tokens off;

    # Canonicalize trailing slashes: /about/ -> /about (matches .htaccess).
    rewrite ^/(.+)/+$ /$1 permanent;

    # Hashed Vite output. Missing files must 404 loudly instead of falling back
    # to index.html, otherwise a stale deploy serves an HTML page as JavaScript.
    location /assets/ {
        try_files $uri =404;
        access_log off;
    }

    # Legacy form endpoint. Kept on a local upstream so this static vhost needs
    # no PHP-FPM. Replace with a `fastcgi_pass` block if PHP runs on this host.
    location = /contact.php {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Clean URLs: /about -> /about.html, then SPA fallback for client routes.
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    error_page 404 /404.html;

    add_header Cache-Control $mw_cache_control always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/xml application/manifest+json image/svg+xml;
}
